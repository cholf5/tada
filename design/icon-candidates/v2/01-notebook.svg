<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="cover" x1="0.1" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#EC6442"/>
      <stop offset="0.5" stop-color="#D5422A"/>
      <stop offset="1" stop-color="#B32B16"/>
    </linearGradient>
    <radialGradient id="light" cx="0.3" cy="0.16" r="0.8">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.2"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="spine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8B1F0E"/>
      <stop offset="0.42" stop-color="#C33B22"/>
      <stop offset="0.72" stop-color="#A92A15"/>
      <stop offset="1" stop-color="#7E1A0B"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0" stop-color="#FFFBF0"/>
      <stop offset="0.5" stop-color="#F7E9CC"/>
      <stop offset="1" stop-color="#DFC193"/>
    </linearGradient>
    <pattern id="grain" width="64" height="64" patternUnits="userSpaceOnUse">
      <circle cx="9" cy="12" r="1.7" fill="#3D0C03" opacity="0.05"/>
      <circle cx="41" cy="33" r="1.2" fill="#FFFFFF" opacity="0.06"/>
      <circle cx="21" cy="51" r="1" fill="#3D0C03" opacity="0.04"/>
      <circle cx="55" cy="7" r="1" fill="#FFFFFF" opacity="0.04"/>
    </pattern>
    <filter id="checkShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="12" dy="14" stdDeviation="20" flood-color="#4A0F04" flood-opacity="0.30"/>
    </filter>
    <filter id="spineShadow" x="-30%" y="-5%" width="160%" height="110%">
      <feDropShadow dx="12" dy="0" stdDeviation="14" flood-color="#3B0A02" flood-opacity="0.35"/>
    </filter>
    <filter id="seamShadow" x="-50%" y="-5%" width="200%" height="110%">
      <feDropShadow dx="6" dy="0" stdDeviation="4" flood-color="#2E0701" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#cover)"/>
  <rect width="1024" height="1024" fill="url(#light)"/>
  <rect width="1024" height="1024" fill="url(#grain)"/>
  <rect x="12" y="12" width="1000" height="1000" rx="228" fill="none" stroke="#FFDCC6" stroke-opacity="0.16" stroke-width="10"/>
  <g filter="url(#spineShadow)">
    <rect x="0" y="0" width="198" height="1024" fill="url(#spine)"/>
  </g>
  <g fill="#F8E9C9" opacity="0.5">
    <rect x="62" y="284" width="70" height="13" rx="6.5"/>
    <rect x="62" y="505" width="70" height="13" rx="6.5"/>
    <rect x="62" y="726" width="70" height="13" rx="6.5"/>
  </g>
  <g filter="url(#seamShadow)">
    <rect x="198" y="0" width="7" height="1024" fill="#5C1105" opacity="0.6"/>
  </g>
  <rect x="205" y="0" width="5" height="1024" fill="#FFE0C0" opacity="0.22"/>
  <path d="M 350 530 L 490 670 L 780 370" fill="none" stroke="#5C1105" stroke-opacity="0.3" stroke-width="172" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 350 530 L 490 670 L 780 370" fill="none" stroke="url(#paper)" stroke-width="160" stroke-linecap="round" stroke-linejoin="round" filter="url(#checkShadow)"/>
</svg>
