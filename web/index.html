<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="description" content="单用户、多端同步、本地优先的待办应用" />
    <meta name="application-name" content="Tada" />
    <!-- iOS：主屏安装后以独立应用打开（旧版 Safari 只认 apple-* 这组 meta） -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Tada" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Tada</title>
    <!-- 首屏绘制前套用手动选择的日间/夜间，避免闪一下系统配色。
         键名与 web/src/lib/theme.ts 的 STORAGE_KEY 保持一致。 -->
    <script>
      (function () {
        try {
          var mode = localStorage.getItem('tada.theme');
          if (mode === 'light' || mode === 'dark') {
            document.documentElement.setAttribute('data-theme', mode);
          }
        } catch (error) {
          /* localStorage 不可用时退回 CSS 的「跟随系统」 */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
